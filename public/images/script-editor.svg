<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Background -->
  <rect width="500" height="400" rx="12" fill="#FAFAF8"/>
  
  <!-- Editor window -->
  <rect x="30" y="30" width="440" height="340" rx="12" fill="white" stroke="#E5E5E0" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="30" y="30" width="440" height="40" rx="12" fill="#F3F2EE"/>
  <rect x="30" y="58" width="440" height="1" fill="#E5E5E0"/>
  <circle cx="52" cy="50" r="5" fill="#E43636"/>
  <circle cx="68" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="84" cy="50" r="5" fill="#10B981"/>
  <rect x="180" y="44" width="140" height="12" rx="6" fill="#E5E5E0"/>
  
  <!-- Script title -->
  <rect x="50" y="90" width="300" height="14" rx="4" fill="#1A1A1A"/>
  <rect x="50" y="112" width="200" height="8" rx="4" fill="#6B6B78"/>
  
  <!-- Block 1: Hook -->
  <rect x="50" y="140" width="400" height="50" rx="8" fill="#F3F2EE" stroke="#E5E5E0" stroke-width="1"/>
  <circle cx="66" cy="165" r="6" fill="#E43636"/>
  <rect x="80" y="155" width="40" height="6" rx="3" fill="#1A1A1A"/>
  <rect x="80" y="167" width="280" height="4" rx="2" fill="#6B6B78"/>
  <rect x="410" y="157" width="24" height="16" rx="4" fill="white" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="416" y="162" width="12" height="6" rx="2" fill="#6B6B78"/>
  
  <!-- Block 2: Intro (expanded) -->
  <rect x="50" y="200" width="400" height="80" rx="8" fill="white" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="66" cy="220" r="6" fill="#1A1A1A"/>
  <rect x="80" y="214" width="60" height="6" rx="3" fill="#1A1A1A"/>
  <rect x="80" y="232" width="350" height="4" rx="2" fill="#6B6B78"/>
  <rect x="80" y="242" width="300" height="4" rx="2" fill="#6B6B78"/>
  <rect x="80" y="252" width="320" height="4" rx="2" fill="#6B6B78"/>
  <rect x="410" y="212" width="24" height="16" rx="4" fill="#F3F2EE" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="416" y="217" width="12" height="6" rx="2" fill="#6B6B78"/>
  
  <!-- Block 3: Body -->
  <rect x="50" y="290" width="400" height="50" rx="8" fill="#F3F2EE" stroke="#E5E5E0" stroke-width="1"/>
  <circle cx="66" cy="315" r="6" fill="#1A1A1A"/>
  <rect x="80" y="305" width="40" height="6" rx="3" fill="#1A1A1A"/>
  <rect x="80" y="317" width="280" height="4" rx="2" fill="#6B6B78"/>
  <rect x="410" y="307" width="24" height="16" rx="4" fill="white" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="416" y="312" width="12" height="6" rx="2" fill="#6B6B78"/>
  
  <!-- Action buttons at bottom -->
  <rect x="50" y="350" width="120" height="28" rx="6" fill="#1A1A1A"/>
  <rect x="78" y="360" width="64" height="8" rx="4" fill="rgba(255,255,255,0.8)"/>
  
  <rect x="180" y="350" width="100" height="28" rx="6" fill="white" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="204" y="360" width="52" height="8" rx="4" fill="#6B6B78"/>
</svg>
