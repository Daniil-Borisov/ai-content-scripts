<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="12" fill="#FAFAF8"/>
  
  <!-- Step 1: Idea -->
  <circle cx="60" cy="150" r="30" fill="#F3F2EE" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="50" y="140" width="20" height="3" rx="1.5" fill="#1A1A1A"/>
  <rect x="56" y="134" width="8" height="15" rx="1" fill="#1A1A1A"/>
  <rect x="30" y="195" width="60" height="6" rx="3" fill="#1A1A1A"/>
  <rect x="38" y="207" width="44" height="4" rx="2" fill="#6B6B78"/>
  
  <!-- Arrow 1 -->
  <line x1="95" y1="150" x2="125" y2="150" stroke="#E5E5E0" stroke-width="2"/>
  <polygon points="125,145 135,150 125,155" fill="#E5E5E0"/>
  
  <!-- Step 2: Research -->
  <circle cx="170" cy="150" r="30" fill="#F3F2EE" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="160" y="142" width="20" height="14" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="164" y1="148" x2="176" y2="148" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="164" y1="152" x2="174" y2="152" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="140" y="195" width="60" height="6" rx="3" fill="#1A1A1A"/>
  <rect x="148" y="207" width="44" height="4" rx="2" fill="#6B6B78"/>
  
  <!-- Arrow 2 -->
  <line x1="205" y1="150" x2="235" y2="150" stroke="#E5E5E0" stroke-width="2"/>
  <polygon points="235,145 245,150 235,155" fill="#E5E5E0"/>
  
  <!-- Step 3: Script -->
  <circle cx="280" cy="150" r="30" fill="#F3F2EE" stroke="#E5E5E0" stroke-width="1"/>
  <rect x="270" y="140" width="20" height="18" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="274" y1="146" x2="286" y2="146" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="274" y1="150" x2="282" y2="150" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="274" y1="154" x2="284" y2="154" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="250" y="195" width="60" height="6" rx="3" fill="#1A1A1A"/>
  <rect x="258" y="207" width="44" height="4" rx="2" fill="#6B6B78"/>
  
  <!-- Arrow 3 -->
  <line x1="315" y1="150" x2="345" y2="150" stroke="#E5E5E0" stroke-width="2"/>
  <polygon points="345,145 355,150 345,155" fill="#E5E5E0"/>
  
  <!-- Step 4: Publish -->
  <circle cx="370" cy="150" r="20" fill="#E43636"/>
  <polygon points="365,142 365,158 380,150" fill="white"/>
  
  <!-- Top label -->
  <rect x="120" y="40" width="160" height="30" rx="8" fill="#1A1A1A"/>
  <rect x="148" y="51" width="104" height="8" rx="4" fill="rgba(255,255,255,0.8)"/>
</svg>
