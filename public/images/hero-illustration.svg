<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#1A1A1A"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Content Pack Card -->
  <rect x="60" y="60" width="320" height="380" rx="12" fill="#222222" stroke="#333333" stroke-width="1"/>
  
  <!-- Card header -->
  <rect x="80" y="80" width="120" height="8" rx="4" fill="#444444"/>
  <rect x="80" y="100" width="80" height="6" rx="3" fill="#333333"/>
  
  <!-- Script blocks -->
  <rect x="80" y="130" width="280" height="40" rx="8" fill="#2A2A2A" stroke="#333333" stroke-width="1"/>
  <circle cx="96" cy="150" r="4" fill="#E43636"/>
  <rect x="108" y="144" width="60" height="6" rx="3" fill="#555555"/>
  <rect x="108" y="154" width="180" height="4" rx="2" fill="#333333"/>
  
  <rect x="80" y="180" width="280" height="40" rx="8" fill="#2A2A2A" stroke="#333333" stroke-width="1"/>
  <circle cx="96" cy="200" r="4" fill="#444444"/>
  <rect x="108" y="194" width="80" height="6" rx="3" fill="#555555"/>
  <rect x="108" y="204" width="140" height="4" rx="2" fill="#333333"/>
  
  <rect x="80" y="230" width="280" height="60" rx="8" fill="#2A2A2A" stroke="#333333" stroke-width="1"/>
  <circle cx="96" cy="260" r="4" fill="#444444"/>
  <rect x="108" y="250" width="50" height="6" rx="3" fill="#555555"/>
  <rect x="108" y="264" width="220" height="4" rx="2" fill="#333333"/>
  <rect x="108" y="274" width="180" height="4" rx="2" fill="#333333"/>
  
  <rect x="80" y="300" width="280" height="40" rx="8" fill="#2A2A2A" stroke="#333333" stroke-width="1"/>
  <circle cx="96" cy="320" r="4" fill="#444444"/>
  <rect x="108" y="314" width="70" height="6" rx="3" fill="#555555"/>
  <rect x="108" y="324" width="160" height="4" rx="2" fill="#333333"/>
  
  <!-- Action buttons -->
  <rect x="80" y="360" width="130" height="36" rx="8" fill="#E43636"/>
  <rect x="110" y="374" width="70" height="8" rx="4" fill="rgba(255,255,255,0.8)"/>
  
  <rect x="220" y="360" width="130" height="36" rx="8" fill="transparent" stroke="#444444" stroke-width="1"/>
  <rect x="250" y="374" width="70" height="8" rx="4" fill="#666666"/>
  
  <!-- Platform icons on right side -->
  <!-- YouTube -->
  <rect x="440" y="80" width="140" height="100" rx="12" fill="#222222" stroke="#333333" stroke-width="1"/>
  <rect x="460" y="100" width="40" height="28" rx="6" fill="rgba(239,68,68,0.15)"/>
  <polygon points="475,108 475,124 489,116" fill="#EF4444"/>
  <rect x="510" y="104" width="50" height="6" rx="3" fill="#555555"/>
  <rect x="510" y="116" width="40" height="4" rx="2" fill="#333333"/>
  <rect x="460" y="140" width="100" height="4" rx="2" fill="#333333"/>
  <rect x="460" y="150" width="80" height="4" rx="2" fill="#333333"/>
  <rect x="460" y="160" width="60" height="4" rx="2" fill="#333333"/>
  
  <!-- TikTok -->
  <rect x="600" y="80" width="140" height="100" rx="12" fill="#222222" stroke="#333333" stroke-width="1"/>
  <rect x="620" y="100" width="40" height="28" rx="6" fill="rgba(236,72,153,0.15)"/>
  <rect x="632" y="108" width="16" height="12" rx="2" fill="#EC4899"/>
  <rect x="670" y="104" width="50" height="6" rx="3" fill="#555555"/>
  <rect x="670" y="116" width="40" height="4" rx="2" fill="#333333"/>
  <rect x="620" y="140" width="100" height="4" rx="2" fill="#333333"/>
  <rect x="620" y="150" width="80" height="4" rx="2" fill="#333333"/>
  <rect x="620" y="160" width="60" height="4" rx="2" fill="#333333"/>
  
  <!-- Instagram -->
  <rect x="440" y="200" width="140" height="100" rx="12" fill="#222222" stroke="#333333" stroke-width="1"/>
  <rect x="460" y="220" width="40" height="28" rx="6" fill="rgba(168,85,247,0.15)"/>
  <rect x="470" y="228" width="20" height="12" rx="4" fill="#A855F7"/>
  <rect x="510" y="224" width="50" height="6" rx="3" fill="#555555"/>
  <rect x="510" y="236" width="40" height="4" rx="2" fill="#333333"/>
  <rect x="460" y="260" width="100" height="4" rx="2" fill="#333333"/>
  <rect x="460" y="270" width="80" height="4" rx="2" fill="#333333"/>
  
  <!-- LinkedIn -->
  <rect x="600" y="200" width="140" height="100" rx="12" fill="#222222" stroke="#333333" stroke-width="1"/>
  <rect x="620" y="220" width="40" height="28" rx="6" fill="rgba(59,130,246,0.15)"/>
  <rect x="632" y="228" width="16" height="12" rx="2" fill="#3B82F6"/>
  <rect x="670" y="224" width="50" height="6" rx="3" fill="#555555"/>
  <rect x="670" y="236" width="40" height="4" rx="2" fill="#333333"/>
  <rect x="620" y="260" width="100" height="4" rx="2" fill="#333333"/>
  <rect x="620" y="270" width="80" height="4" rx="2" fill="#333333"/>
  
  <!-- X/Twitter -->
  <rect x="520" y="320" width="140" height="100" rx="12" fill="#222222" stroke="#333333" stroke-width="1"/>
  <rect x="540" y="340" width="40" height="28" rx="6" fill="rgba(107,114,128,0.15)"/>
  <rect x="552" y="348" width="16" height="12" rx="2" fill="#6B7280"/>
  <rect x="590" y="344" width="50" height="6" rx="3" fill="#555555"/>
  <rect x="590" y="356" width="40" height="4" rx="2" fill="#333333"/>
  <rect x="540" y="380" width="100" height="4" rx="2" fill="#333333"/>
  <rect x="540" y="390" width="80" height="4" rx="2" fill="#333333"/>
  
  <!-- Connection lines -->
  <line x1="380" y1="200" x2="440" y2="130" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="380" y1="200" x2="600" y2="130" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="380" y1="250" x2="440" y2="250" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="380" y1="250" x2="600" y2="250" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="380" y1="300" x2="520" y2="370" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Decorative dots -->
  <circle cx="410" cy="130" r="3" fill="#E43636" opacity="0.6"/>
  <circle cx="410" cy="250" r="3" fill="#E43636" opacity="0.6"/>
  <circle cx="410" cy="370" r="3" fill="#E43636" opacity="0.6"/>
</svg>
